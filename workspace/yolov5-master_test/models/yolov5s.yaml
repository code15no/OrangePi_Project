# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
#  [
#    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
#    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
#    [-1, 3, C3, [128]],
#    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
#    [-1, 6, C3, [256]],
#    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
#    [-1, 9, C3, [512]],
#    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
#    [-1, 3, C3, [1024]],
#    [-1, 1, SPPF, [1024, 5]], # 9
#  ]
 [[-1, 1, Focus, [64, 3]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3CBAM, [128]],  # 2（替换C3为C3CBAM）
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3CBAM, [256]],  # 4（替换）
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3CBAM, [512]],  # 6（替换）
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3CBAM, [1024]],  # 8（替换）
   [-1, 1, SPP, [1024, [5, 9, 13]]],  # 9
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]], # 17 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]], # cat head P4
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]], # cat head P5
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]

# 修改示例（Neck部分关键位置）
neck:
  # P5→P4融合
  [[-1, 1, GSConv, [512, 1, 1]],  # 10（原Conv→GSConv，1×1卷积）
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 11
   [[-1, 6], 1, BiFPNFusion, [512]],  # 12
   [-1, 3, C3CBAM, [512, False]],  # 13

   # P4→P3融合
   [-1, 1, GSConv, [256, 1, 1]],  # 14（原Conv→GSConv）
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 15
   [[-1, 4], 1, BiFPNFusion, [256]],  # 16
   [-1, 3, C3CBAM, [256, False]],  # 17

   # P3→P4反向融合
   [-1, 1, GSConv, [256, 3, 2]],  # 18（原BiFPNConv→GSConv，3×3步长2）
   [[-1, 14], 1, BiFPNFusion, [512]],  # 19
   [-1, 3, C3CBAM, [512, False]],  # 20

   # P4→P5反向融合
   [-1, 1, GSConv, [512, 3, 2]],  # 21（原BiFPNConv→GSConv）
   [[-1, 10], 1, BiFPNFusion, [1024]],  # 22
   [-1, 3, C3CBAM, [1024, False]],  # 23
  ]
